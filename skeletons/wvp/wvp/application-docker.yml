spring:
    cache:
        type: redis
    thymeleaf:
        cache: false
    mvc:
        async:
            request-timeout: 20000
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 100MB
    data:
      redis:
          host: ${REDIS_HOST:127.0.0.1}
          port: ${REDIS_PORT:6379}
          database: 1
          password:
          timeout: 10000
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://${DATABASE_HOST:127.0.0.1}:${DATABASE_PORT:5432}/${DATABASE_NAME:wvp}
        username: ${DATABASE_USER:root}
        password: ${DATABASE_PASSWORD:root}

pagehelper:
    helper-dialect: postgresql

server:
    port: 18978
    ssl:
        enabled: false

sip:
    ip: 0.0.0.0
    show-ip: ${SIP_ShowIP}
    port: ${SIP_Port:8116}
    domain: ${SIP_Domain:3402000000}
    id: ${SIP_Id:34020000002000000001}
    password: ${SIP_Password}
    register-time-interval: 60
    ptz-speed: 50
    alarm: true
    timeout: 1000

media:
  id: polaris
  ip: ${ZLM_HOST:127.0.0.1}
  http-port: 80
  stream-ip: ${Stream_IP}
  sdp-ip: ${SDP_IP}
  hook-ip: ${ZLM_HOOK_HOST}
  http-ssl-port: 0
  flv-port: ${MediaHttp:}
  flv-ssl-port: ${MediaHttps:}
  ws-flv-port: ${MediaHttp:}
  ws-flv-ssl-port: ${MediaHttps:}
  rtp-proxy-port: ${MediaRtp:}
  rtmp-port: ${MediaRtmp:}
  rtmp-ssl-port: 0
  rtsp-port: ${MediaRtsp:}
  rtsp-ssl-port: 0
  auto-config: true
  secret: ${ZLM_SERCERT}
  rtp:
    enable: false
    port-range: 30000,30500
    send-port-range: 50502,50506

  record-path: /opt/media/bin/www/record/
  record-day: 7
  record-assist-port: 0
user-settings:
    auto-apply-play: true
    play-timeout: 30000
    wait-track: false
    record-push-live: ${RecordPushLive:false}
    record-sip: ${RecordSip:false}
    stream-on-demand: true
    interface-authentication: true
    broadcast-for-platform: TCP-PASSIVE
    push-stream-after-ack: true
    send-to-platforms-when-id-lost: true
    interface-authentication-excludes:
    push-authority: true
    jwkFile: /opt/wvp/config/jwk.json
logging:
  config: classpath:logback-spring.xml
